name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Extract ZIP
      run: |
        ZIP=$(find . -name "*.zip" | head -1)
        unzip "$ZIP" -d project/
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    - name: Create env file
      run: |
        DIR=$(find project -name "gradlew" -exec dirname {} \; | head -1)
        echo "GEMINI_API_KEY=placeholder" > "$DIR/.env"
    - name: Build APK
      run: |
        DIR=$(find project -name "gradlew" -exec dirname {} \; | head -1)
        cd "$DIR"
        chmod +x gradlew
        ./gradlew assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MCQ-Master-APK
        path: "**/*.apk"
